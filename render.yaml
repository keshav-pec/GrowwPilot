# Render Blueprint for the API (Render dashboard -> New -> Blueprint -> pick this repo).
# Secrets are NOT stored here: Render asks for the values marked "sync: false" when you create it.
services:
  - type: web
    name: growwpilot-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI # your Atlas connection string, ending in /growwpilot?...
        sync: false
      - key: JWT_SECRET # Render generates a long random value
        generateValue: true
      - key: CLIENT_ORIGIN # your Vercel URL, e.g. https://growwpilot.vercel.app
        sync: false
      - key: TRUST_PROXY # requests arrive through Vercel, then Render's own proxy
        value: 2
      # Email (optional, see "Setting up email" in the README). Apps Script is the main route.
      - key: MAIL_SCRIPT # the Apps Script /exec link
        sync: false
      - key: MAIL_SCRIPT_SECRET # same value as MAIL_SECRET in the script's properties (24+ characters)
        sync: false
      - key: MAIL_FORGOT_PASSWORD # optional: a second script for password emails
        sync: false
      - key: EMAIL_USER # optional SMTP backup: blocked on Render's free plan, works on paid plans
        sync: false
      - key: EMAIL_PASS # a Gmail app password
        sync: false
      - key: MAIL_DAILY_LIMIT # most emails per 24 hours for the whole app (Gmail allows about 100)
        value: 90
